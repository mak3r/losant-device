apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    helm.sh/resource-policy: keep
  name: losantsyncs.losant.io
  labels:
    {{- include "losant-device.labels" . | nindent 4 }}
spec:
  group: losant.io
  names:
    kind: LosantSync
    listKind: LosantSyncList
    plural: losantsyncs
    singular: losantsync
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="GEAReachable")].status
      name: GEA
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .status.nextScheduledTime
      name: Next Sync
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LosantSync is the Schema for the losantsyncs API.
          It configures the operator for a single k3s cluster, controlling how cluster health
          metrics are collected and reported to the Losant IoT platform via the GEA hybrid model.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LosantSyncSpec defines the desired state of LosantSync.

              Exactly one of cronSchedule or interval must be set.
            properties:
              applicationID:
                description: ApplicationID is the Losant Application ID that owns
                  all devices for this cluster.
                type: string
              clusterName:
                description: ClusterName is the human-readable name of this k8s cluster,
                  used as a Losant device tag.
                minLength: 1
                type: string
              cronSchedule:
                description: |-
                  CronSchedule is a standard cron expression controlling how often metrics are reported.
                  Mutually exclusive with Interval.
                type: string
              deviceRecipeID:
                description: DeviceRecipeID is an optional Losant device recipe ID
                  used for bulk peripheral provisioning.
                type: string
              gea:
                description: GEA configures the in-cluster Gateway Edge Agent service.
                properties:
                  deploymentRef:
                    description: |-
                      DeploymentRef is the name of the GEA Deployment for rolling-restart automation.
                      If empty, credential bootstrap writes the Secret but does not restart the GEA.
                    type: string
                  port:
                    default: 8080
                    description: Port is the HTTP trigger port on the GEA pod (default
                      8080).
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  serviceRef:
                    description: ServiceRef is the name of the in-cluster Service
                      fronting the GEA pod.
                    type: string
                required:
                - port
                - serviceRef
                type: object
              interval:
                description: |-
                  Interval is a Go duration string (e.g. "1m", "5m") controlling report frequency.
                  Mutually exclusive with CronSchedule.
                type: string
              provisioningSecretRef:
                description: |-
                  ProvisioningSecretRef references the Secret containing Losant API credentials
                  used for device provisioning (not used by the GEA).
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              rancherURL:
                description: |-
                  RancherURL is the base URL of the Rancher Manager instance managing this cluster.
                  Used to render a direct link on the Losant Level 2 dashboard.
                type: string
              region:
                description: Region identifies the geographic region of this cluster,
                  used as a Losant device tag.
                minLength: 1
                type: string
              suspend:
                default: false
                description: Suspend disables all reconciliation when true.
                type: boolean
              workflowDeployments:
                description: |-
                  WorkflowDeployments lists Edge Workflows to deploy to this cluster's Edge Compute device.
                  If omitted, no workflow deployment is attempted.
                items:
                  description: WorkflowDeployment declares a single Edge Workflow
                    version to deploy to this cluster's Edge Compute device.
                  properties:
                    flowId:
                      description: FlowID is the Losant Edge Workflow ID.
                      type: string
                    version:
                      description: Version is the named workflow version to deploy.
                      type: string
                  required:
                  - flowId
                  - version
                  type: object
                type: array
            required:
            - applicationID
            - clusterName
            - gea
            - provisioningSecretRef
            - region
            type: object
            x-kubernetes-validations:
            - message: exactly one of cronSchedule or interval must be set
              rule: has(self.cronSchedule) != has(self.interval)
          status:
            description: LosantSyncStatus defines the observed state of LosantSync.
            properties:
              clusterDeviceID:
                description: ClusterDeviceID is the Losant device ID of the Edge Compute
                  device representing this cluster.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of the resource's state.
                  Known condition types: GEABootstrapped, GEAReachable, DevicesProvisioned, LastSyncSucceeded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is the timestamp of the most recent successful
                  metric report to the GEA.
                format: date-time
                type: string
              nextScheduledTime:
                description: |-
                  NextScheduledTime is the timestamp when the next metric report is due.
                  Persisted so controller restarts re-arm the schedule without missing a cycle.
                format: date-time
                type: string
              nodeDevices:
                additionalProperties:
                  type: string
                description: NodeDevices maps Kubernetes node names to their Losant
                  peripheral device IDs.
                type: object
              phase:
                description: Phase is the current lifecycle phase of this resource.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "losant-device.fullname" . }}-gea
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "losant-device.labels" . | nindent 4 }}
    app.kubernetes.io/component: gea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: losant-gea
  template:
    metadata:
      labels:
        app: losant-gea
    spec:
      serviceAccountName: {{ include "losant-device.fullname" . }}-gea
      initContainers:
        - name: wait-for-credentials
          image: busybox:latest
          command:
            - sh
            - -c
            - 'until [ -s /tmp/gea-creds/DEVICE_ID ]; do echo "waiting for GEA credentials secret"; sleep 5; done'
          volumeMounts:
            - name: gea-credentials-probe
              mountPath: /tmp/gea-creds
      containers:
        - name: edge-agent
          image: "{{ .Values.gea.image.repository }}:{{ .Values.gea.image.tag }}"
          imagePullPolicy: {{ .Values.gea.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gea.service.port }}
              name: http-trigger
          env:
            - name: DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "losant-device.geaSecretName" . }}
                  key: DEVICE_ID
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "losant-device.geaSecretName" . }}
                  key: ACCESS_KEY
            - name: ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "losant-device.geaSecretName" . }}
                  key: ACCESS_SECRET
          resources:
            {{- toYaml .Values.gea.resources | nindent 12 }}
          volumeMounts:
            - name: gea-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: {{ .Values.gea.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gea.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: gea-credentials-probe
          secret:
            secretName: {{ include "losant-device.geaSecretName" . }}
            optional: true
        - name: gea-data
          persistentVolumeClaim:
            claimName: {{ include "losant-device.fullname" . }}-gea-data

{{- /* Controller Deployment — full implementation in Phase 5 */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: losant-device-controller-manager
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "losant-device.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "losant-device.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "losant-device.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "losant-device.serviceAccountName" . }}
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: GEA_DEPLOYMENT_REF
              value: {{ if .Values.gea.deploymentRef }}{{ .Values.gea.deploymentRef | quote }}{{ else }}{{ printf "%s-gea" (include "losant-device.fullname" .) | quote }}{{ end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}

name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  dockerfile-go-version:
    name: Dockerfile Go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile builder matches go.mod
        run: |
          GOMOD_VER=$(grep '^go ' go.mod | awk '{print $2}')
          DOCKERFILE_VER=$(grep '^FROM golang:' Dockerfile | sed 's/FROM golang:\([^ ]*\).*/\1/')
          echo "go.mod requires: $GOMOD_VER"
          echo "Dockerfile uses: $DOCKERFILE_VER"
          if [ "$GOMOD_VER" != "$DOCKERFILE_VER" ]; then
            echo "ERROR: Dockerfile golang version ($DOCKERFILE_VER) does not match go.mod ($GOMOD_VER)"
            exit 1
          fi

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/

  manifest-drift:
    name: Manifest Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate manifests
        run: make manifests

      - name: Check for RBAC drift
        run: |
          python3 - <<'EOF'
          import subprocess, sys, yaml

          generated_file = "config/rbac/role.yaml"
          try:
              committed_bytes = subprocess.check_output(
                  ["git", "show", "HEAD:" + generated_file], stderr=subprocess.DEVNULL
              )
          except subprocess.CalledProcessError:
              print("ERROR: config/rbac/role.yaml does not exist in the committed baseline.")
              print("Add it via a security-reviewed PR before enabling this guard.")
              sys.exit(1)

          with open(generated_file) as f:
              generated = yaml.safe_load(f)
          committed = yaml.safe_load(committed_bytes)

          def expand(rules):
              """Expand rules into individual (apiGroup, resource, verb) triples.
              This makes the comparison insensitive to how rules are grouped."""
              out = set()
              for r in (rules or []):
                  for g in r.get("apiGroups", []):
                      for res in r.get("resources", []):
                          for v in r.get("verbs", []):
                              out.add((g, res, v))
              return out

          gen_perms = expand(generated.get("rules", []))
          com_perms = expand(committed.get("rules", []))

          if gen_perms == com_perms:
              print("RBAC rules are in sync with the committed security baseline.")
              sys.exit(0)

          added = gen_perms - com_perms
          removed = com_perms - gen_perms
          print("ERROR: config/rbac/role.yaml permissions have drifted from the committed baseline.")
          print("A security review is required before adding new RBAC permissions.")
          print("Open an issue labeled persona/security and type/security before merging.")
          if added:
              print("\nAdded permissions (require security review):")
              for g, res, v in sorted(added):
                  print(f"  apiGroup={g!r} resource={res!r} verb={v!r}")
          if removed:
              print("\nRemoved permissions:")
              for g, res, v in sorted(removed):
                  print(f"  apiGroup={g!r} resource={res!r} verb={v!r}")
          sys.exit(1)
          EOF

  helm-crd-drift:
    name: Helm CRD Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate manifests
        run: make manifests

      - name: Check Helm CRD schema matches generated CRD
        run: |
          python3 - <<'EOF'
          import yaml, sys

          with open("helm/templates/crd.yaml") as f:
              helm_raw = "\n".join(
                  line.rstrip("\n") for line in f
                  if "{{" not in line
              )

          with open("config/crd/bases/losant.io_losantsyncs.yaml") as f:
              gen_raw = f.read()

          helm_crd = yaml.safe_load(helm_raw)
          gen_crd = yaml.safe_load(gen_raw)

          helm_versions = helm_crd["spec"]["versions"]
          gen_versions = gen_crd["spec"]["versions"]

          if helm_versions == gen_versions:
              print("helm/templates/crd.yaml spec.versions matches generated CRD — no drift.")
              sys.exit(0)

          print("ERROR: helm/templates/crd.yaml spec.versions has drifted from config/crd/bases/losant.io_losantsyncs.yaml")
          print("Sync helm/templates/crd.yaml with the generated CRD after running 'make manifests'.")
          sys.exit(1)
          EOF

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make test
      - run: make docker-buildx IMG=ghcr.io/mak3r/losant-device:${{ github.ref_name }}
      - run: make docker-buildx IMG=ghcr.io/mak3r/losant-device:latest
      - name: Verify multi-arch manifest
        run: |
          MANIFEST=$(docker buildx imagetools inspect ghcr.io/mak3r/losant-device:${{ github.ref_name }})
          echo "## Multi-arch manifest: ghcr.io/mak3r/losant-device:${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$MANIFEST" | grep -q "linux/amd64" || { echo "ERROR: linux/amd64 digest missing from manifest"; exit 1; }
          echo "$MANIFEST" | grep -q "linux/arm64" || { echo "ERROR: linux/arm64 digest missing from manifest"; exit 1; }
          echo "Verified: linux/amd64 and linux/arm64 both present."
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-chart:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject Chart version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG#v}"
          sed -i "s/^version:.*/version: ${APP_VERSION}/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${APP_VERSION}/" helm/Chart.yaml
      - name: Log in to GHCR Helm registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push Helm chart
        run: |
          helm package helm/
          helm push losant-device-*.tgz oci://ghcr.io/mak3r/losant-device/charts
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate CRD manifests
        run: make manifests
      - name: Upload CRD asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat config/crd/bases/*.yaml > crds.yaml
          gh release upload "${GITHUB_REF_NAME}" crds.yaml

  chart-install-smoke:
    runs-on: ubuntu-latest
    needs: [publish-chart]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create kind cluster
        run: kind create cluster --wait 60s
      - name: Log in to GHCR Helm registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install Helm chart from OCI
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG#v}"
          helm install losant-device \
            oci://ghcr.io/mak3r/losant-device/charts/losant-device \
            --version "${APP_VERSION}" \
            --create-namespace \
            --namespace losant-device-system \
            --wait \
            --timeout 120s
      - name: Assert CRD is registered
        run: kubectl get crd losantsyncs.losant.losant.com
      - name: Assert controller pod is Running
        run: |
          kubectl wait --for=condition=Ready pod \
            -l control-plane=controller-manager \
            -n losant-device-system \
            --timeout=120s
      - name: Assert chart version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION="${TAG#v}"
          CHART_VERSION=$(helm get metadata losant-device -n losant-device-system -o json | jq -r '.version')
          if [ "${CHART_VERSION}" != "${APP_VERSION}" ]; then
            echo "ERROR: chart version '${CHART_VERSION}' does not match expected '${APP_VERSION}'"
            exit 1
          fi
          echo "Chart version verified: ${CHART_VERSION}"

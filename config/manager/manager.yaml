apiVersion: v1
kind: Namespace
metadata:
  name: losant-system
  labels:
    app.kubernetes.io/name: losant-device-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: losant-device-controller-manager
  namespace: losant-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: losant-device-controller
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: losant-device-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: losant-device-controller
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: controller:latest
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: losant-device-controller
      terminationGracePeriodSeconds: 10
